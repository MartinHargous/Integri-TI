<!-- =======================================================
     COMPONENTE: MODAL DE AJUSTES Y NOTIFICACIÓN TOAST
     ======================================================= -->
<!-- MODAL SOBRIO DE AJUSTES DE MÓDULO -->
<div id="modal-ajustes" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3 sm:p-4 font-sans">
  <div class="bg-[#111827] border border-[#1f2937] rounded-lg shadow-xl max-w-xl w-full flex flex-col max-h-[90vh] overflow-hidden">
    <div class="flex items-center justify-between border-b border-[#1f2937] px-4 py-3 bg-[#141d2e]/40">
      <h3 id="modal-titulo" class="font-semibold text-sm sm:text-base text-white uppercase tracking-wider">Ajustes: Módulo</h3>
      <button onclick="cerrarModalAjustes()" class="text-slate-400 hover:text-white text-xl leading-none p-1">&times;</button>
    </div>
    <div class="px-4 py-2 bg-[#0b0f19] border-b border-[#1f2937] text-xs sm:text-sm text-slate-300 flex items-center justify-between font-mono">
      <span id="modal-archivo-ruta" class="truncate">Destino: Global</span>
    </div>
    <div id="modal-cuerpo-campos" class="p-3 sm:p-4 overflow-y-auto flex flex-col gap-2.5 text-xs sm:text-sm flex-1 max-h-[60vh] font-mono">
      <!-- Campos renderizados dinámicamente -->
    </div>
    <div class="flex flex-col xs:flex-row items-center justify-between border-t border-[#1f2937] px-4 py-3 bg-[#141d2e]/40 gap-2">
      <span id="modal-status-msg" class="text-xs sm:text-sm text-slate-400"></span>
      <div class="flex items-center gap-2.5 w-full xs:w-auto justify-end">
        <button onclick="cerrarModalAjustes()" class="px-3.5 py-1.5 rounded bg-[#1f2937] hover:bg-[#374151] text-slate-300 border border-[#374151] text-xs sm:text-sm transition-colors">Cancelar</button>
        <button onclick="guardarAjustesModal()" id="btn-guardar-modal" class="px-4 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs sm:text-sm transition-colors">
          Guardar y Enviar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST DE NOTIFICACIÓN SOBRIO -->
<div id="toast" class="fixed bottom-3 right-3 max-w-sm bg-[#111827] border border-slate-700 text-slate-200 text-xs sm:text-sm font-mono px-4 py-2.5 rounded shadow-lg pointer-events-none opacity-0 transition-opacity duration-200 flex items-center gap-2.5 z-50">
  <span class="w-2 h-2 rounded-full bg-blue-400 shrink-0"></span>
  <span id="toast-msg" class="truncate">Mensaje</span>
</div>
