<!-- COMPONENTE: ALERTAS RECIENTES (MÁXIMO 4 TARJETAS)-->
<section class="bg-[#111827] border border-[#1f2937] rounded-lg p-3 sm:p-3.5 flex flex-col gap-2.5">
  <div class="flex flex-col xs:flex-row items-start xs:items-center justify-between border-b border-[#1f2937] pb-2 gap-2">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-200">
        Alertas Recientes del Examen (Máximo 4)
      </h2>
      <span id="contador-alertas-badge" class="px-2 py-0.5 rounded text-xs font-mono font-semibold bg-red-950/60 text-red-300 border border-red-800/60">0</span>
    </div>

    <div class="flex items-center gap-2.5 text-xs sm:text-sm font-mono self-end xs:self-auto">
      <span id="texto-resumen-alertas" class="text-slate-400 text-xs hidden sm:inline"></span>
      <button onclick="reanalizarHistorial()" class="px-2.5 py-1 rounded bg-[#1f2937] hover:bg-[#374151] text-slate-200 border border-[#374151] text-xs transition-colors" type="button" title="Vuelve a analizar los logs con las reglas actuales">
        Re-analizar
      </button>
      <button onclick="limpiarAlertas()" class="text-slate-400 hover:text-slate-200 underline text-xs" type="button">Limpiar</button>
    </div>
  </div>

  <!-- CONTENEDOR DE LAS 4 ALERTAS  -->
  <div id="contenedor-alertas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 font-mono text-xs sm:text-sm">
    <div id="sin-alertas-aviso" class="col-span-full py-6 text-center text-slate-400 text-xs sm:text-sm border border-dashed border-[#1f2937] rounded-lg bg-[#0b0f19]/30">
      No hay alertas registradas en este momento.
    </div>
  </div>

  <!-- FLUJO SECUNDARIO COLAPSABLE DE TELEMETRÍA DE DIAGNÓSTICO -->
  <details class="group pt-1.5 border-t border-[#1f2937]">
    <summary class="cursor-pointer text-xs text-slate-400 hover:text-slate-200 flex items-center justify-between select-none font-mono">
      <span>Flujo de Telemetría en Crudo (Diagnóstico)</span>
      <span class="text-[10px] text-slate-500 group-open:rotate-180 transition-transform">▼</span>
    </summary>
    <div id="contenedor-telemetria-raw" class="mt-1.5 max-h-28 overflow-y-auto flex flex-col gap-1 text-xs font-mono bg-[#0b0f19] p-2 rounded border border-[#1f2937]">
      <div class="text-slate-500 text-center py-1">Sin eventos recientes.</div>
    </div>
  </details>
</section>
